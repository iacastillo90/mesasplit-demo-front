plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cl.labtab'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('mapstructVersion', '1.5.5.Final')
	set('jjwtVersion', '0.12.6')
	set('springdocVersion', '2.6.0')
}

dependencies {
	// Web MVC — @RestController, @RequestMapping, HTTP stack
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA + Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Spring Security 6/7
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// WebSocket + STOMP
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Bean Validation — @Valid en DTOs de request
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Actuator — /actuator/health para Docker healthcheck
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Driver JDBC de PostgreSQL 16
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway — migraciones de base de datos
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// JJWT — generación y validación de JWT
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// MapStruct — mapeo Model ↔ DTO en compilación
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	// Springdoc OpenAPI — Swagger UI
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Testing — PostgreSQL real vía Testcontainers (nunca H2)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	useJUnitPlatform()
}
