services:
  db:
    image: postgres:16-alpine
    container_name: labtab-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labtab_dev}
      POSTGRES_USER: ${POSTGRES_USER:-labtab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Se requiere POSTGRES_PASSWORD. Copia .env.example a .env y define un valor.}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labtab} -d ${POSTGRES_DB:-labtab_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labtab-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labtab-api-dev
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-labtab_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-labtab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Se requiere JWT_SECRET. Copia .env.example a .env y define un valor.}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - labtab-network

volumes:
  postgres_data:
    driver: local

networks:
  labtab-network:
    driver: bridge
