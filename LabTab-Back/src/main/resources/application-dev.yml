spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

logging:
  level:
    cl.labtab: DEBUG
    org.springframework.security: DEBUG
