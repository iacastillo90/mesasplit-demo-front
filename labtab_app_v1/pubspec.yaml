name: labtab_app_v1
description: "LabTab - App del comensal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegacion
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  stomp_dart_client: ^2.0.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # QR
  mobile_scanner: ^5.2.3

  # Pagos
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Notificaciones
  flutter_local_notifications: ^18.0.1

  # Utilidades
  logger: ^2.5.0
  connectivity_plus: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
