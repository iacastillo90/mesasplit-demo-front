<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#0B132B" stroke="#F59E0B" stroke-width="2" />

  <!-- Anillo exterior dorado y cian -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="37" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" />

  <!-- Segmentos divididos de la cuenta del restaurante (MesaSplit) -->
  <!-- Segmento 1 (Top right - destacado) -->
  <path d="M 50 50 L 50 16 A 34 34 0 0 1 82 40 Z" fill="url(#goldGrad)" stroke="#0B132B" stroke-width="2" transform="translate(2, -2)" />

  <!-- Segmentos circulares -->
  <path d="M 50 50 L 84 50 A 34 34 0 0 1 67 80 Z" fill="url(#cyanGrad)" stroke="#0B132B" stroke-width="2" />
  <path d="M 50 50 L 67 80 A 34 34 0 0 1 33 80 Z" fill="#0EA5E9" stroke="#0B132B" stroke-width="2" />
  <path d="M 50 50 L 33 80 A 34 34 0 0 1 16 50 Z" fill="#F59E0B" stroke="#0B132B" stroke-width="2" />
  <path d="M 50 50 L 16 50 A 34 34 0 0 1 33 20 Z" fill="#FBBF24" stroke="#0B132B" stroke-width="2" />
  <path d="M 50 50 L 33 20 A 34 34 0 0 1 48 16 Z" fill="#F59E0B" stroke="#0B132B" stroke-width="2" />
</svg>
